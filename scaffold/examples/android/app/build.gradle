plugins {
    id "com.android.application"
}

android {
    namespace "com.earthengine.minimalglobe"
    compileSdk 36

    defaultConfig {
        applicationId "com.earthengine.minimalglobe"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DGLM_INCLUDE_DIR=/Users/ldy/Desktop/work/globe/third_party/vcpkg/packages/glm_arm64-android/include"
                cppFlags "-std=c++17"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../MinimalGlobe/AndroidManifest.xml"
            java.srcDirs = ["../MinimalGlobe"]
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
