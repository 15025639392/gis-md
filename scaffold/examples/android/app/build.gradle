plugins {
    id "com.android.application"
}

android {
    namespace "com.earthengine.minimalglobe"
    compileSdk 36

    defaultConfig {
        applicationId "com.earthengine.minimalglobe"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../MinimalGlobe/AndroidManifest.xml"
        }
    }
}

dependencies {
    implementation project(":earthsdk")
}
