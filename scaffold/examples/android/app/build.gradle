plugins {
    id "com.android.application"
}

android {
    namespace "com.earthengine.minimalglobe"
    compileSdk 35

    defaultConfig {
        applicationId "com.earthengine.minimalglobe"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_PREFIX_PATH=/opt/homebrew"
                cppFlags "-std=c++17"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../MinimalGlobe/AndroidManifest.xml"
            java.srcDirs = ["../MinimalGlobe"]
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
