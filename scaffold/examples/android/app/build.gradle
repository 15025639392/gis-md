plugins {
    id "com.android.application"
}

android {
    namespace "com.earthengine.minimalglobe"
    compileSdk 36

    defaultConfig {
        applicationId "com.earthengine.minimalglobe"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                def glmIncludeDir = System.getenv("GLM_INCLUDE_DIR")
                if (glmIncludeDir != null && !glmIncludeDir.isBlank()) {
                    arguments "-DGLM_INCLUDE_DIR=${glmIncludeDir}"
                }
                cppFlags "-std=c++17"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../MinimalGlobe/AndroidManifest.xml"
            java.srcDirs = ["../MinimalGlobe"]
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }
}
